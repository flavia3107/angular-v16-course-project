<div class="row">
  <div class="col-xs-10">
    <app-shopping-edit></app-shopping-edit>

    <ul class="list-group">
      <li *ngFor="let ingredient of ingredients; let i = index">
        <ng-container *ngIf="editMode && activeIndex === i; else showIngredient">
          <app-shopping-edit [editedItem]="ingredient" (onCloseClicked)="closeEditMode()"></app-shopping-edit>
        </ng-container>
        <ng-template #showIngredient>
          <div class="flex-row" (click)="onEditItem(i)">
            <span>{{ingredient?.name}}</span>
            <span class="dots"></span>
            <span>{{ingredient?.amount}}</span>
          </div>
        </ng-template>
      </li>
    </ul>
  </div>
</div>
