<div class="row">
  <div>
    <app-shopping-edit></app-shopping-edit>
    <div class="flex-row space_between">
      <ul *ngIf="(ingredients | async)?.length; else empty" class="list-group">
        <li class="flex-row space_between title">
          <span>Item</span>
          <span>Quantity</span>
        </li>
        <li *ngFor="let ingredient of (ingredients | async); let i = index">
          <ng-container *ngIf="editMode && activeIndex === i; else showIngredient">
            <app-shopping-edit [editedItem]="ingredient" (onCloseClicked)="closeEditMode()"></app-shopping-edit>
          </ng-container>
          <ng-template #showIngredient>
            <div class="flex-row" (click)="onEditItem(i)">
              <span>{{ingredient?.name}}</span>
              <span class="dots"></span>
              <span>{{ingredient?.amount}}</span>
            </div>
          </ng-template>
        </li>
      </ul>
      <img src="/assets/cart.svg">
    </div>
  </div>
</div>
<ng-template #empty>
  <div class="empty">
    <h2 class="empty-message ">No items</h2>
  </div>
</ng-template>
