<div class="row">
  <div class="col-xs-12">
    <form (ngSubmit)="onSubmit(f)" #f="ngForm">
      <div class="flex-row">
        <input type="text" id="name" class="form-control" name="name" placeholder="Name" [ngModel]="editedItem?.name"
          required>
        <input type="number" id="amount" class="form-control" name="amount" placeholder="Amount"
          [ngModel]="editedItem?.amount" required pattern="^[1-9]+[0-9]*$">
        <div class="col-xs-12">
          <button class="btn btn-success" type="submit" [disabled]="!f.valid">{{ editMode ? 'Update' : 'Add' }}</button>
          <button class="btn btn-danger" type="button" (click)="onDelete()" *ngIf="editMode">Delete</button>
          <button class="btn btn-primary" type="button" (click)="onClear()">Clear</button>
          <button *ngIf="!!editedItem" class="btn btn-primary" type="button" (click)="onClose()">Close</button>
        </div>
      </div>
    </form>
  </div>
</div>
