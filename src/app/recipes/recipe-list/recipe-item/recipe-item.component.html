<a style="cursor: pointer;" [routerLink]="[index]" routerLinkActive="active"
  [style.height]="expanded ? 'fit-content' : '13rem'" class="list-group-item clearfix">
  <div class="pull-left">
    <h4 class="list-group-item-heading">{{ recipe.name }}</h4>
    <p [class.ellipsis]="!expanded" class="list-group-item-text">{{ recipe.description }}</p>
  </div>
  <div class="flex-row right">
    <span (click)="expand()">{{expanded ? 'Less...' : 'More...'}}</span>
  </div>
</a>
